[package]
name = "svn_excel_parser"
version = "0.1.0"
edition = "2021"

[workspace]
members = ["vendor/calamine"]
resolver = "2"

[dependencies]
calamine = { path = "vendor/calamine", version = "=0.31.0" }
quick-xml = "0.38"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = "4.6"
